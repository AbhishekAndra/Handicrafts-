<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - CraftMarket</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .confirm-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 50px 20px 80px;
        }

        .confirm-hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .confirm-tick {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: oklch(0.94 0.03 132);
            color: var(--success-color);
            font-size: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .confirm-hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .confirm-hero p {
            color: var(--text-light);
        }

        .order-panel {
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .order-panel h2 {
            font-size: 18px;
            padding: 18px 25px;
            background-color: var(--light-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-panel .body {
            padding: 25px;
        }

        .line {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .line:last-child {
            border-bottom: none;
        }

        .line .thumb {
            width: 55px;
            height: 55px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--light-bg), var(--border-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .line .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .line .name {
            flex: 1;
        }

        .line .meta {
            font-size: 13px;
            color: var(--text-light);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        .summary-row.total {
            border-top: 2px solid var(--border-color);
            margin-top: 10px;
            padding-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .detail-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .detail-columns h3 {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .detail-columns p {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.8;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            background-color: oklch(0.94 0.04 70);
            color: var(--warning-color);
        }

        .confirm-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .not-found {
            text-align: center;
            padding: 60px 20px;
        }

        .not-found i {
            font-size: 60px;
            color: var(--border-color);
            display: block;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .detail-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <header class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="logo">
                    <a href="../index.html" class="logo-link">
                        <img src="../assets/images/Stackly_logo_transparent.webp" alt="Stackly" class="logo-img">
                    </a>
                </div>
                <nav class="nav-menu">
                    <a href="../index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link">Shop</a>
                    <a href="seller-dashboard.html" class="nav-link">Sell</a>
                    <a href="services.html" class="nav-link">Services</a>
                    <a href="about.html" class="nav-link">About</a>
                </nav>
                <div class="nav-icons">
                    <a href="wishlist.html" class="icon-link" title="Wishlist">
                        <i class="fas fa-heart"></i>
                        <span class="badge" id="wishlist-count">0</span>
                    </a>
                    <a href="cart.html" class="icon-link" title="Shopping Cart">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cart-count">0</span>
                    </a>
                    <a href="account.html" class="icon-link" title="Account">
                        <i class="fas fa-user"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="confirm-wrap" id="confirm-root"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-brand">
                <a href="../index.html" class="logo-link">
                    <img src="../assets/images/Stackly_logo_transparent.webp" alt="Stackly" class="footer-logo-img">
                </a>
            </div>
            <div class="footer-grid">
                <div class="footer-section">
                    <h4>About CraftMarket</h4>
                    <p>Supporting artisans worldwide by providing a platform for authentic handicrafts.</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="products.html">Shop</a></li>
                        <li><a href="seller-dashboard.html">Become a Seller</a></li>
                        <li><a href="about.html">About Us</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Support</h4>
                    <ul>
                        <li><a href="#">Contact Us</a></li>
                        <li><a href="#">Shipping Info</a></li>
                        <li><a href="#">Returns</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
        const orderId = new URLSearchParams(window.location.search).get('id');
        const orders = getOrders();
        const order = orderId ? orders.find(o => o.id === orderId) : orders[0];
        const root = document.getElementById('confirm-root');

        const DELIVERY_DAYS = { standard: 7, express: 3, overnight: 1 };

        function estimatedDelivery(order) {
            const days = DELIVERY_DAYS[order.shippingMethod] || 7;
            const date = new Date(order.date);
            date.setDate(date.getDate() + days);
            return date.toDateString();
        }

        if (!order) {
            root.innerHTML = `
                <div class="not-found">
                    <i class="fas fa-receipt"></i>
                    <h2>Order not found</h2>
                    <p>We could not find that order in this browser.</p>
                    <a href="products.html" class="btn btn-primary" style="margin-top: 20px;">Continue Shopping</a>
                </div>
            `;
        } else {
            const paymentLabels = { card: 'Credit/Debit Card', paypal: 'PayPal', stripe: 'Apple Pay / Google Pay' };
            const shippingLabels = { standard: 'Standard (5-7 days)', express: 'Express (2-3 days)', overnight: 'Overnight (1 day)' };

            root.innerHTML = `
                <div class="confirm-hero">
                    <div class="confirm-tick"><i class="fas fa-check"></i></div>
                    <h1>Thank you for your order!</h1>
                    <p>A confirmation has been sent to ${order.address.email}. Your artisans are being notified now.</p>
                </div>

                <div class="order-panel">
                    <h2>
                        <span>Order ${order.id}</span>
                        <span class="status-badge">${order.status}</span>
                    </h2>
                    <div class="body">
                        ${order.items.map(item => `
                            <div class="line">
                                <div class="thumb">${productImageMarkup(item)}</div>
                                <div class="name">
                                    <strong>${item.name}</strong>
                                    <div class="meta">Qty ${item.quantity} · by ${item.seller}</div>
                                </div>
                                <div>$${(item.price * item.quantity).toFixed(2)}</div>
                            </div>
                        `).join('')}

                        <div style="margin-top: 20px;">
                            <div class="summary-row">
                                <span>Subtotal</span><span>$${order.subtotal.toFixed(2)}</span>
                            </div>
                            ${order.discount > 0 ? `
                            <div class="summary-row" style="color: var(--success-color);">
                                <span>Discount${order.coupon ? ` (${order.coupon})` : ''}</span>
                                <span>−$${order.discount.toFixed(2)}</span>
                            </div>` : ''}
                            <div class="summary-row">
                                <span>Shipping</span>
                                <span>${order.shipping === 0 ? 'Free' : '$' + order.shipping.toFixed(2)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Tax</span><span>$${order.tax.toFixed(2)}</span>
                            </div>
                            <div class="summary-row total">
                                <span>Total Paid</span><span>$${order.total.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="order-panel">
                    <h2>Delivery Details</h2>
                    <div class="body detail-columns">
                        <div>
                            <h3>Shipping To</h3>
                            <p>
                                ${order.address.name}<br>
                                ${order.address.street}<br>
                                ${order.address.city}, ${order.address.state} ${order.address.zip}<br>
                                ${order.address.country}<br>
                                ${order.address.phone}
                            </p>
                        </div>
                        <div>
                            <h3>Shipping Method</h3>
                            <p>${shippingLabels[order.shippingMethod] || order.shippingMethod}</p>
                            <h3 style="margin-top: 15px;">Estimated Delivery</h3>
                            <p>${estimatedDelivery(order)}</p>
                            <h3 style="margin-top: 15px;">Payment</h3>
                            <p>${paymentLabels[order.payment] || order.payment}</p>
                        </div>
                    </div>
                </div>

                <div class="confirm-actions">
                    <a href="account.html#orders" class="btn btn-primary">View My Orders</a>
                    <a href="products.html" class="btn btn-outline">Continue Shopping</a>
                </div>
            `;
        }
    </script>
</body>
</html>
