<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - CraftMarket</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            padding: 40px 20px;
        }

        .detail-gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detail-image {
            width: 100%;
            height: 420px;
            background: linear-gradient(135deg, var(--light-bg), var(--border-color));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 160px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .thumb {
            height: 90px;
            background: linear-gradient(135deg, var(--light-bg), var(--border-color));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
            overflow: hidden;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb:hover,
        .thumb.active {
            border-color: var(--primary-color);
        }

        .detail-info h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .detail-price {
            font-size: 34px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .detail-price .was {
            font-size: 20px;
            color: var(--text-light);
            text-decoration: line-through;
            margin-left: 10px;
            font-weight: normal;
        }

        .save-tag {
            display: inline-block;
            background-color: oklch(0.94 0.03 132);
            color: var(--success-color);
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .detail-description {
            color: var(--text-light);
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .quantity-control button {
            background-color: var(--light-bg);
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 16px;
        }

        .quantity-control button:hover {
            background-color: var(--border-color);
        }

        .quantity-control input {
            border: none;
            width: 60px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }

        .stock-line {
            font-weight: 600;
            margin-bottom: 20px;
        }

        .in-stock {
            color: var(--success-color);
        }

        .out-of-stock {
            color: var(--error-color);
        }

        .detail-perks {
            list-style: none;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .detail-perks li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--text-light);
            font-size: 14px;
        }

        .detail-perks i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .seller-box {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .seller-box .seller-avatar {
            width: 60px;
            height: 60px;
            font-size: 28px;
            margin: 0;
        }

        .section-block {
            padding: 40px 20px;
        }

        .section-block h2 {
            font-size: 26px;
            margin-bottom: 25px;
        }

        .review-card {
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .review-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .review-head strong {
            font-size: 16px;
        }

        .review-date {
            color: var(--text-light);
            font-size: 13px;
        }

        .not-found {
            text-align: center;
            padding: 80px 20px;
        }

        .not-found i {
            font-size: 60px;
            color: var(--border-color);
            display: block;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .detail-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .detail-image {
                height: 280px;
                font-size: 110px;
            }

            .detail-info h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <header class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="logo">
                    <a href="../index.html" class="logo-link">
                        <img src="../assets/images/Stackly_logo_transparent.webp" alt="Stackly" class="logo-img">
                    </a>
                </div>
                <nav class="nav-menu" id="navMenu">
                    <a href="../index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link active">Shop</a>
                    <a href="seller-dashboard.html" class="nav-link">Sell</a>
                    <a href="services.html" class="nav-link">Services</a>
                    <a href="about.html" class="nav-link">About</a>
                </nav>
                <div class="nav-icons">
                    <a href="wishlist.html" class="icon-link" title="Wishlist">
                        <i class="fas fa-heart"></i>
                        <span class="badge" id="wishlist-count">0</span>
                    </a>
                    <a href="cart.html" class="icon-link" title="Shopping Cart">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cart-count">0</span>
                    </a>
                    <a href="account.html" class="icon-link" title="Account">
                        <i class="fas fa-user"></i>
                    </a>
                </div>
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
                    <span class="menu-toggle-bar"></span>
                    <span class="menu-toggle-bar"></span>
                    <span class="menu-toggle-bar"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="container">
        <div class="breadcrumb" id="breadcrumb">
            <a href="../index.html">Home</a> / <a href="products.html">Shop</a>
        </div>
    </div>

    <!-- Product Detail -->
    <div class="container">
        <div id="detail-root"></div>
    </div>

    <!-- Reviews -->
    <div class="container">
        <div class="section-block" id="reviews-block"></div>
    </div>

    <!-- Related Products -->
    <div class="container">
        <div class="section-block" id="related-block"></div>
    </div>

    <!-- Footer -->
    <footer class="footer" style="margin-top: 60px;">
        <div class="container">
            <div class="footer-brand">
                <a href="../index.html" class="logo-link">
                    <img src="../assets/images/Stackly_logo_transparent.webp" alt="Stackly" class="footer-logo-img">
                </a>
            </div>
            <div class="footer-grid">
                <div class="footer-section">
                    <h4>About CraftMarket</h4>
                    <p>Supporting artisans worldwide by providing a platform for authentic handicrafts.</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="products.html">Shop</a></li>
                        <li><a href="seller-dashboard.html">Become a Seller</a></li>
                        <li><a href="about.html">About Us</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Support</h4>
                    <ul>
                        <li><a href="#">Contact Us</a></li>
                        <li><a href="#">Shipping Info</a></li>
                        <li><a href="#">Returns</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Follow Us</h4>
                    <div class="social-links">
                        <a href="../404.html" title="Facebook"><i class="fab fa-facebook"></i></a>
                        <a href="../404.html" title="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="../404.html" title="Twitter"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
    <script>
        const productId = parseInt(new URLSearchParams(window.location.search).get('id'));
        const product = products.find(p => p.id === productId);

        function renderNotFound() {
            document.getElementById('detail-root').innerHTML = `
                <div class="not-found">
                    <i class="fas fa-box-open"></i>
                    <h2>Product not found</h2>
                    <p>The item you are looking for is no longer available.</p>
                    <a href="products.html" class="btn btn-primary" style="margin-top: 20px;">Browse Products</a>
                </div>
            `;
        }

        function renderProduct() {
            const seller = sellers.find(s => s.id === product.seller_id);
            const saving = product.original_price - product.price;
            const savingPercent = Math.round((saving / product.original_price) * 100);
            const wishlisted = isInWishlist(product.id);

            document.getElementById('breadcrumb').innerHTML = `
                <a href="../index.html">Home</a> /
                <a href="products.html?category=${product.category}">${product.category}</a> /
                ${product.name}
            `;

            document.getElementById('detail-root').innerHTML = `
                <div class="detail-container">
                    <div class="detail-gallery">
                        <div class="detail-image">${productImageMarkup(product)}</div>
                        <div class="thumb-row">
                            <div class="thumb active">${productImageMarkup(product)}</div>
                            <div class="thumb">${productImageMarkup(product)}</div>
                            <div class="thumb">${productImageMarkup(product)}</div>
                            <div class="thumb">${productImageMarkup(product)}</div>
                        </div>
                    </div>

                    <div class="detail-info">
                        <div class="product-category">${product.category}</div>
                        <h1>${product.name}</h1>

                        <div class="detail-meta">
                            <span class="stars">${'⭐'.repeat(Math.round(product.rating))}</span>
                            <span>${product.rating} out of 5</span>
                            <span>·</span>
                            <a href="#reviews-block" style="color: var(--primary-color);">${product.reviews} reviews</a>
                        </div>

                        <div class="detail-price">
                            $${product.price.toFixed(2)}
                            ${saving > 0 ? `<span class="was">$${product.original_price.toFixed(2)}</span>` : ''}
                        </div>
                        ${saving > 0 ? `<div class="save-tag">You save $${saving.toFixed(2)} (${savingPercent}%)</div>` : ''}

                        <p class="detail-description">${product.description}</p>

                        <div class="seller-box">
                            <div class="seller-avatar">${seller ? sellerAvatarMarkup(seller) : '🎨'}</div>
                            <div style="flex: 1;">
                                <strong>${product.seller}</strong>
                                ${seller && seller.verified ? '<i class="fas fa-check-circle" style="color: var(--success-color); font-size: 14px;"></i>' : ''}
                                <div style="font-size: 14px; color: var(--text-light);">
                                    ${seller ? `⭐ ${seller.rating} · ${seller.products} products · ${seller.followers} followers` : ''}
                                </div>
                            </div>
                            <a href="seller-profile.html?seller=${product.seller_id}" class="btn btn-outline btn-small">Visit Shop</a>
                        </div>

                        <div class="stock-line ${product.in_stock ? 'in-stock' : 'out-of-stock'}">
                            <i class="fas ${product.in_stock ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                            ${product.in_stock ? 'In stock and ready to ship' : 'Currently out of stock'}
                        </div>

                        <div class="detail-row">
                            <div class="quantity-control">
                                <button type="button" onclick="changeQty(-1)">−</button>
                                <input type="number" id="qty" value="1" readonly>
                                <button type="button" onclick="changeQty(1)">+</button>
                            </div>
                            <button class="btn btn-primary" id="detail-add-btn" ${product.in_stock ? '' : 'disabled'}>
                                <i class="fas fa-shopping-cart"></i> Add to Cart
                            </button>
                            <button class="btn btn-outline" id="detail-wishlist-btn">
                                <i class="${wishlisted ? 'fas' : 'far'} fa-heart"></i>
                                <span>${wishlisted ? 'In Wishlist' : 'Add to Wishlist'}</span>
                            </button>
                        </div>

                        <ul class="detail-perks">
                            <li><i class="fas fa-truck"></i> Free standard shipping on orders over $50</li>
                            <li><i class="fas fa-undo"></i> 30-day returns on all handmade items</li>
                            <li><i class="fas fa-hand-holding-heart"></i> Made by hand — small variations are part of the charm</li>
                            <li><i class="fas fa-shield-alt"></i> Secure checkout and buyer protection</li>
                        </ul>
                    </div>
                </div>
            `;

            document.getElementById('detail-add-btn').addEventListener('click', () => {
                if (!product.in_stock) return;
                const qty = parseInt(document.getElementById('qty').value);
                addToCart(product.id, qty);
                showNotification(`${qty} × ${product.name} added to cart!`, 'success');
            });

            document.getElementById('detail-wishlist-btn').addEventListener('click', function () {
                toggleWishlist(product.id);
                const active = isInWishlist(product.id);
                this.querySelector('i').className = `${active ? 'fas' : 'far'} fa-heart`;
                this.querySelector('span').textContent = active ? 'In Wishlist' : 'Add to Wishlist';
                showNotification(active ? 'Added to wishlist' : 'Removed from wishlist', 'info');
            });

            document.querySelectorAll('.thumb').forEach(thumb => {
                thumb.addEventListener('click', () => {
                    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                });
            });
        }

        function changeQty(delta) {
            const input = document.getElementById('qty');
            const next = parseInt(input.value) + delta;
            input.value = Math.min(Math.max(next, 1), 10);
        }

        function renderReviews() {
            const list = reviews[product.id] || [];
            const block = document.getElementById('reviews-block');

            const cards = list.length
                ? list.map(r => `
                    <div class="review-card">
                        <div class="review-head">
                            <strong>${r.user}</strong>
                            <span class="review-date">${r.date}</span>
                        </div>
                        <div class="stars">${'⭐'.repeat(r.rating)}</div>
                        <p style="margin-top: 8px; color: var(--text-light);">${r.text}</p>
                    </div>
                `).join('')
                : '<p style="color: var(--text-light);">No written reviews yet — be the first to share your thoughts.</p>';

            block.innerHTML = `
                <h2>Customer Reviews <span style="color: var(--text-light); font-size: 18px;">(${product.reviews})</span></h2>
                ${cards}
            `;
        }

        function renderRelated() {
            const related = products
                .filter(p => p.id !== product.id && (p.category === product.category || p.seller_id === product.seller_id))
                .slice(0, 4);

            if (!related.length) return;

            document.getElementById('related-block').innerHTML = `
                <h2>You May Also Like</h2>
                <div class="product-grid">
                    ${related.map(p => createProductCard(p)).join('')}
                </div>
            `;
            attachProductCardListeners();
        }

        if (!product) {
            renderNotFound();
        } else {
            document.title = `${product.name} - CraftMarket`;
            renderProduct();
            renderReviews();
            renderRelated();
        }
    </script>
</body>
</html>
